
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Repositório de atividades de Educação Física do Colégio Estadual Ana Bernardes.">

    <title>Repositório de Atividades | Educação Física</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="atividades.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <div class="container">
            <h2>Colégio Estadual Ana Bernardes</h2>
            <h1>Repositório de Atividades</h1>
            <p>Educação Física</p>
            <span>Professor Rodrigo Ribeiro</span>
        </div>
    </header>

    <main class="container">

        <section id="selecaoTurma" class="selecao-turma">
            <h2>Escolha sua turma</h2>
            <p>Selecione o ano para acessar as atividades.</p>

            <div class="turmas">
                <button class="turma" type="button" data-turma="7ano">
                    7º Ano
                </button>

                <button class="turma" type="button" data-turma="8ano">
                    8º Ano
                </button>

                <button class="turma" type="button" data-turma="9ano">
                    9º Ano
                </button>
            </div>
        </section>

        <section id="areaTurma" class="area-turma" hidden>

            <div class="cabecalho-turma">
                <h2 id="nomeTurma"></h2>

                <button id="voltar" class="botao-voltar" type="button">
                    ← Escolher outra turma
                </button>
            </div>

            <section class="unidade">
                <button class="titulo-unidade" type="button" aria-expanded="false">
                    <span>📘 I Unidade</span>
                    <span class="seta" aria-hidden="true">▼</span>
                </button>
                <div class="conteudo" hidden>
                    <div id="unidade1"></div>
                </div>
            </section>

            <section class="unidade">
                <button class="titulo-unidade" type="button" aria-expanded="false">
                    <span>📗 II Unidade</span>
                    <span class="seta" aria-hidden="true">▼</span>
                </button>
                <div class="conteudo" hidden>
                    <div id="unidade2"></div>
                </div>
            </section>

            <section class="unidade">
                <button class="titulo-unidade" type="button" aria-expanded="false">
                    <span>📕 III Unidade</span>
                    <span class="seta" aria-hidden="true">▼</span>
                </button>
                <div class="conteudo" hidden>
                    <div id="unidade3"></div>
                </div>
            </section>

        </section>

    </main>

    <footer>
        <p>© 2026  Professor Rodrigo Ribeiro</p>
        <small>Colégio Estadual Ana Bernardes</small>
    </footer>

</body>
</html>
